<style>

  .board {
    grid-template-columns: 36fr 28fr 36fr;
    grid-template-rows: 12fr 64fr 24fr;
    grid-template-areas:
      "tl tm tr"
      "name name photo"
      "links links photo";
  }


  .name { grid-area: name; display: flex; flex-direction: column; justify-content: flex-end; }
  .name h1 { font-weight: 700; font-size: clamp(48px, 9.2vw, 150px); line-height: .88; letter-spacing: -.045em; }
  .name h1 span { display: block; overflow: hidden; padding-bottom: .04em; }
  .name h1 i { display: block; font-style: normal; }
  .name h1 .dot { color: var(--grey); font-style: normal; }
  .spec { margin-top: clamp(16px, 2.4vh, 28px); }
  .roles { margin-top: 4px; font: 500 clamp(12px, 1.05vw, 15px) var(--mono); letter-spacing: .14em; }
  .roles .sep { color: var(--line); margin: 0 .6em; }

  .photo { grid-area: photo; padding: 0; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; filter: grayscale(1) contrast(1.05); }
  .photo .shutter { position: absolute; inset: 0; background: var(--bg); transform-origin: bottom; }
  .photo figcaption { position: absolute; left: 14px; bottom: 12px; font: 10px var(--mono); letter-spacing: .12em; color: #fff; mix-blend-mode: difference; }


  .links { grid-area: links; display: flex; flex-direction: column; justify-content: space-between; }
  .socials { display: flex; flex-direction: column; font: 500 12px var(--mono); letter-spacing: .1em; }
  .socials a { position: relative; isolation: isolate; overflow: hidden; display: flex; justify-content: space-between; align-items: center;
    padding: 7px 8px; border-top: 1px solid var(--line); transition: color .35s; }
  .socials a:last-child { border-bottom: 1px solid var(--line); }
  /* black bar sweeps in from the left on hover, out to the right on leave */
  .socials a::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--ink);
    transform: scaleX(0); transform-origin: right; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .socials a:hover, .socials a:focus-visible { color: var(--bg); }
  .socials a:hover::before, .socials a:focus-visible::before { transform: scaleX(1); transform-origin: left; }
  .socials a { gap: 12px; white-space: nowrap; }
  .socials .num { color: var(--grey); margin-right: 10px; }
  .socials .handle { color: var(--grey); text-transform: none; font-size: clamp(9.5px, .8vw, 11px); letter-spacing: .02em; transition: color .35s; overflow: hidden; text-overflow: ellipsis; }
  .socials a:hover .handle, .socials a:focus-visible .handle { color: var(--bg); }
  .socials .go { display: inline-block; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .socials a:hover .go, .socials a:focus-visible .go { transform: translate(3px, -3px); }
  .js .name h1 i { transform: translateY(110%); }

  /* phones: stack and allow scroll (the no-scroll rule is for laptop viewing) */
  @media (max-width: 760px) {
    .board { grid-template-areas: "tl tr" "tm tm" "photo photo" "name name" "links links"; }
    .photo { aspect-ratio: 3/4; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="assets/blueprint.js"></script>
<script>
(() => {
  const root = document.documentElement;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const shutter = document.querySelector('.shutter');

  // no anime.js (CDN down) or reduced motion: show the final state immediately
  if (typeof anime === 'undefined' || reduced) {
    root.classList.remove('js');
    shutter.remove();
  } else {
    anime.timeline({ easing: 'cubicBezier(.2,.8,.2,1)' })
      .add({ targets: '.ln.h', scaleX: [0, 1], duration: 900, delay: anime.stagger(140) })
      .add({ targets: '.ln.v', scaleY: [0, 1], duration: 800, delay: anime.stagger(120) }, 250)
      .add({ targets: '.name h1 i', translateY: ['110%', '0%'], duration: 900, delay: anime.stagger(120) }, 800)
      .add({ targets: shutter, scaleY: [1, 0], duration: 1000, easing: 'cubicBezier(.7,0,.2,1)' }, 900)
      .add({ targets: '.fade', opacity: [0, 1], translateY: [8, 0], duration: 600, delay: anime.stagger(70),
             begin: scramble }, 1100);
  }

  // roles line types itself out through random glyphs
  function scramble() {
    const el = document.getElementById('roles');
    const parts = [...el.childNodes].filter(n => n.nodeType === 3);
    const finals = parts.map(n => n.textContent);
    const glyphs = '01<>/{}#$%&*+=';
    let frame = 0;
    const tick = () => {
      frame++;
      parts.forEach((n, i) => {
        const t = finals[i], shown = Math.floor(frame / 2);
        n.textContent = [...t].map((c, j) => j < shown || c === ' ' ? c : glyphs[Math.random() * glyphs.length | 0]).join('');
      });
      if (frame < Math.max(...finals.map(t => t.length)) * 2) requestAnimationFrame(tick);
      else parts.forEach((n, i) => n.textContent = finals[i]);
    };
    tick();
  }
})();
</script>
